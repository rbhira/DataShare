<app-auth-shell>
  <section class="auth-card register-card" aria-labelledby="register-title">
    <h1 id="register-title">Créer un compte</h1>

    @if (errorMessage) {
      <p class="server-message" role="alert">
        {{ errorMessage }}
      </p>
    }

    <form [formGroup]="registerForm" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Saisissez votre email..."
          [attr.aria-invalid]="emailInvalid"
          [attr.aria-describedby]="emailInvalid ? 'register-email-error' : null"
        />

        @if (emailInvalid) {
          <p id="register-email-error" class="field-error" role="alert">
            {{ emailErrorMessage }}
          </p>
        }
      </div>

      <div class="field">
        <label for="register-password">Mot de passe</label>
        <input
          id="register-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Saisissez votre mot de passe..."
          [attr.aria-invalid]="passwordInvalid"
          [attr.aria-describedby]="passwordInvalid ? 'register-password-error' : null"
        />

        @if (passwordInvalid) {
          <p id="register-password-error" class="field-error" role="alert">
            {{ passwordErrorMessage }}
          </p>
        }
      </div>

      <div class="field">
        <label for="register-confirm-password">
          Vérification du mot de passe
        </label>
        <input
          id="register-confirm-password"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Saisissez-le à nouveau"
          [attr.aria-invalid]="confirmPasswordInvalid"
          [attr.aria-describedby]="confirmPasswordInvalid ? 'register-confirm-error' : null"
        />

        @if (confirmPasswordInvalid) {
          <p id="register-confirm-error" class="field-error" role="alert">
            {{ confirmPasswordErrorMessage }}
          </p>
        }
      </div>

      <p class="secondary-link">
        <a routerLink="/login">J'ai déjà un compte</a>
      </p>

      <button
        class="submit-button"
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>
  </section>
</app-auth-shell>
