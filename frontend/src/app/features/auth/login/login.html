<app-auth-shell>
  <section class="auth-card login-card" aria-labelledby="login-title">
    <h1 id="login-title">Connexion</h1>

    @if (successMessage) {
      <p class="success-message" role="status">
        {{ successMessage }}
      </p>
    }

    @if (errorMessage) {
      <p class="server-message" role="alert">
        {{ errorMessage }}
      </p>
    }

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Saisissez votre email..."
          [attr.aria-invalid]="emailInvalid"
          [attr.aria-describedby]="emailInvalid ? 'login-email-error' : null"
        />

        @if (emailInvalid) {
          <p id="login-email-error" class="field-error" role="alert">
            {{ emailErrorMessage }}
          </p>
        }
      </div>

      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Saisissez votre mot de passe..."
          [attr.aria-invalid]="passwordInvalid"
          [attr.aria-describedby]="passwordInvalid ? 'login-password-error' : null"
        />

        @if (passwordInvalid) {
          <p id="login-password-error" class="field-error" role="alert">
            Veuillez saisir votre mot de passe.
          </p>
        }
      </div>

      <p class="secondary-link">
        <a routerLink="/register">Créer un compte</a>
      </p>

      <button
        class="submit-button"
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Connexion...' : 'Connexion' }}
      </button>
    </form>
  </section>
</app-auth-shell>
