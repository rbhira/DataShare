<app-auth-shell>
  <section
    class="welcome"
    aria-labelledby="welcome-title"
  >
    <h1 id="welcome-title">
      Tu veux partager un fichier ?
    </h1>

    <a
      class="upload-cta"
      routerLink="/login"
      aria-label="Se connecter pour partager un fichier"
    >
      <span class="upload-halo" aria-hidden="true">
        <span class="upload-disc">
          <svg
            viewBox="0 0 24 24"
            role="img"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M7.5 18.5H6.25a4.25 4.25 0 0 1-.68-8.45A6.25 6.25 0 0 1 17.7 8.12a5 5 0 0 1 .05 9.98H16.5"
            />
            <path d="M12 18V10.5" />
            <path d="m8.9 13.6 3.1-3.1 3.1 3.1" />
          </svg>
        </span>
      </span>
    </a>
  </section>
</app-auth-shell>
